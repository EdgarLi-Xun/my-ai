spring:
  application:
    name: myAi

  # H2 嵌入式数据库配置（文件模式，数据保存在 ./data/myai.mv.db）
  # AUTO_SERVER=TRUE 允许多 JVM 实例（如 8031 + 8032 + IDE debug）共享同一个 DB 文件
  # 注意：H2 2.x 强制要求 DB_CLOSE_ON_EXIT 不能为 FALSE（与 AUTO_SERVER 互斥）；用默认 TRUE
  # 配合 DB_CLOSE_DELAY=-1（连接池内连接保持打开直到 JVM 退出）。
  datasource:
    jdbc-url: jdbc:h2:file:./data/myai;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always

  # H2 控制台，启动后访问 http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

# AI 厂家池：在 application.yml 维护，键名即 provider。
# 新增厂家只需要在这里加一段，不需要改 Java。
my-ai:
  providers:
    openai:
      display-name: OpenAI
      protocol: OPENAI_COMPATIBLE
      default-base-url: https://api.openai.com
      default-model: gpt-4o-mini
      requires-key: true
    deepseek:
      display-name: DeepSeek
      protocol: OPENAI_COMPATIBLE
      default-base-url: https://api.deepseek.com
      default-model: deepseek-chat
      requires-key: true
    moonshot:
      display-name: Moonshot (Kimi)
      protocol: OPENAI_COMPATIBLE
      default-base-url: https://api.moonshot.cn
      default-model: moonshot-v1-8k
      requires-key: true
    zhipu:
      display-name: 智谱
      protocol: OPENAI_COMPATIBLE
      default-base-url: https://open.bigmodel.cn
      default-model: glm-4-flash
      requires-key: true
    minimax:
      display-name: MiniMax
      protocol: OPENAI_COMPATIBLE
      default-base-url: https://api.minimax.chat
      default-model: MiniMax-Text-01
      requires-key: true
    ollama:
      display-name: Ollama (本地)
      protocol: OLLAMA
      default-base-url: http://localhost:11434
      default-model: qwen2.5:7b
      requires-key: false

  # JWT 签名密钥（长度必须 >= 256 bits / 32 字节）
  jwt:
    secret: ${MYAI_JWT_SECRET:myai-local-dev-secret-at-least-256bits}
    # 过期时间（单位秒），默认 7 天
    expiration: ${MYAI_JWT_EXPIRATION:604800}

  # 对话回收策略：软删对话保留多少天后被定时任务 hard delete（ADR 0003）
  trash:
    retention-days: ${MYAI_TRASH_RETENTION_DAYS:30}

  # 可观测性：AI 调用日志 / 审计日志保留天数（ADR 0004）
  logs:
    retention-days: ${MYAI_LOGS_RETENTION_DAYS:30}
    # 访问日志（access.jsonl）保留天数，独立于 DB 日志
    access-retention-days: ${MYAI_LOGS_ACCESS_RETENTION_DAYS:30}

  # 管理员名单：邮箱列表（大小写不敏感）。匹配用户在 register / login 时会被授予 ADMIN 角色。
  # 没设环境变量则系统没有管理员——查询日志的 API 任何人都调不通。
  admin:
    emails: ${MYAI_ADMIN_EMAILS:}

server:
  port: 8031

logging:
  level:
    org.springframework.ai: info
    cn.edgarli.mapper: info
